<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cubeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Dark Rounded Hexagon Base -->
  <rect width="64" height="64" rx="16" fill="#060913" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#cubeGrad)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Isometric Interlocking Quantum Node Network -->
  <!-- Top Face -->
  <polygon points="32,10 50,20 32,30 14,20" stroke="url(#cubeGrad)" stroke-width="2" fill="#0B0F19" fill-opacity="0.7" />
  <!-- Left Face -->
  <polygon points="14,20 32,30 32,52 14,42" stroke="url(#cubeGrad)" stroke-width="2" fill="#080C16" fill-opacity="0.9" />
  <!-- Right Face -->
  <polygon points="32,30 50,20 50,42 32,52" stroke="url(#cubeGrad)" stroke-width="2" fill="#0F172A" fill-opacity="0.8" />

  <!-- Data Flow Edges / Vectors -->
  <line x1="32" y1="10" x2="32" y2="30" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
  <line x1="14" y1="20" x2="32" y2="30" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round" />
  <line x1="50" y1="20" x2="32" y2="30" stroke="#EC4899" stroke-width="2" stroke-linecap="round" />
  <line x1="32" y1="30" x2="32" y2="52" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />

  <!-- Luminous Nodes at Vertices -->
  <circle cx="32" cy="10" r="3" fill="#38BDF8" filter="url(#glow)" />
  <circle cx="14" cy="20" r="3" fill="#8B5CF6" filter="url(#glow)" />
  <circle cx="50" cy="20" r="3" fill="#EC4899" filter="url(#glow)" />
  <circle cx="32" cy="52" r="3" fill="#38BDF8" filter="url(#glow)" />

  <!-- Central Pulsing Quantum Data Core -->
  <circle cx="32" cy="30" r="4.5" fill="url(#coreGrad)" filter="url(#glow)" stroke="#FFFFFF" stroke-width="1" />
</svg>

